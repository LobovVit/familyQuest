name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: familyquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d familyquest_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FAMILYQUEST_TEST_DATABASE_URL: postgres://postgres:ci-test-only@localhost:5432/familyquest_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Test
        run: npm test

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build versioned containers
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
            test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          fi
          source scripts/build-metadata.sh
          docker build --build-arg APP_VERSION --build-arg APP_COMMIT --build-arg APP_BUILT_AT -t familyquest-api ./backend
          docker build --build-arg APP_VERSION --build-arg APP_COMMIT --build-arg APP_BUILT_AT -t familyquest-web ./frontend

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "FamilyQuest $GITHUB_REF_NAME"

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local documentation links
        run: python3 scripts/check-doc-links.py
      - name: Verify protected Telegram configuration control
        run: python3 -m unittest discover -s scripts -p 'test_telegram_control.py'

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: familyquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d familyquest_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FAMILYQUEST_TEST_DATABASE_URL: postgres://postgres:ci-test-only@localhost:5432/familyquest_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  telegram-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: browser-fixture-only
          POSTGRES_DB: familyquest_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d familyquest_browser_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FAMILYQUEST_TEST_DATABASE_URL: postgres://postgres:browser-fixture-only@127.0.0.1:5432/familyquest_browser_test?sslmode=disable
      FAMILYQUEST_BROWSER_TEST: '1'
      FAMILYQUEST_BROWSER_REPORT: ${{ github.workspace }}/artifacts/telegram-browser-ci.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/browser/package-lock.json
      - run: npm ci --prefix scripts/browser --ignore-scripts
      - run: npm audit --prefix scripts/browser --audit-level=moderate
      - run: npx --prefix scripts/browser playwright install --with-deps chromium
      - name: Real HTTPS Access/Core browser regression with blocked third-party cookies
        run: |
          mkdir -p artifacts
          go -C backend test -race ./internal/store -run '^TestTelegramCrossSiteHTTPSBrowser$' -count=1 -v
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-browser-regression
          path: artifacts/telegram-browser-ci.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Test
        run: npm test

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build versioned containers
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # checkout may replace the local tag ref with the peeled commit.
            # Повторно получаем объект тега и сверяем его с проверяемым коммитом.
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
            test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          fi
          source scripts/build-metadata.sh
          docker build --build-arg APP_VERSION --build-arg APP_COMMIT --build-arg APP_BUILT_AT -t familyquest-api ./backend
          docker build --build-arg APP_VERSION --build-arg APP_COMMIT --build-arg APP_BUILT_AT -t familyquest-web ./frontend

  access-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify real access proxy topology
        run: scripts/check-access-compose.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, containers, access-topology, documentation, telegram-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "FamilyQuest $GITHUB_REF_NAME"

# Add after docker-compose.prod.yml and docker-compose.access.yml to enable OIDC self-registration.
services:
  access:
    environment:
      PROVISIONER_ORIGIN: http://familyquest-provisioner:8083
      PROVISIONER_SHARED_SECRET: ${PROVISIONER_SHARED_SECRET:?A dedicated provisioner secret is required}
    networks:
      provisioning: {}
  provisioner:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    command: ["familyquest-provisioner"]
    environment:
      DATABASE_URL: ${PROVISIONER_DATABASE_URL:?Operator database credentials are required only in provisioner}
      CORE_DATABASE_ROLE: ${CORE_DATABASE_ROLE:?The existing Core runtime SQL role is required}
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC is required for self-registration}
      PROVISIONER_SHARED_SECRET: ${PROVISIONER_SHARED_SECRET:?A dedicated provisioner secret is required}
      HTTP_ADDR: :8083
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      provisioning:
        aliases: [familyquest-provisioner]
      data: {}
networks:
  provisioning:
    internal: true

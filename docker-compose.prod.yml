services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyquest}
      POSTGRES_USER: ${POSTGRES_USER:-familyquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HTTP_ADDR: :8081
      CORS_ORIGIN: https://${PUBLIC_HOST:?PUBLIC_HOST is required}
      FAMILYQUEST_SEED_FILE: ""
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_TTL: ${SESSION_TTL:-12h}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: ["default", "homelab"]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-homelab}
      traefik.http.routers.familyquest-http.rule: Host(`${PUBLIC_HOST:?PUBLIC_HOST is required}`)
      traefik.http.routers.familyquest-http.entrypoints: web
      traefik.http.routers.familyquest-http.middlewares: familyquest-https
      traefik.http.middlewares.familyquest-https.redirectscheme.scheme: https
      traefik.http.middlewares.familyquest-https.redirectscheme.permanent: "true"
      traefik.http.routers.familyquest.rule: Host(`${PUBLIC_HOST:?PUBLIC_HOST is required}`)
      traefik.http.routers.familyquest.entrypoints: websecure
      traefik.http.routers.familyquest.tls: "true"
      traefik.http.routers.familyquest.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.familyquest.loadbalancer.server.port: "8080"

volumes:
  postgres_data:

networks:
  homelab:
    name: ${TRAEFIK_NETWORK:-homelab}
    external: true
